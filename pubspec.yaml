name: formosa
description: >-
  Formosa: themed mnemonic sentences for passwords and BIP39-compatible
  deterministic keys. The library, its terminal app and its theme tools.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  # SHA-256 (the checksum), SHA-512 and HMAC (the seed and the master key).
  crypto: ^3.0.3
  # Unicode normal forms: NFKD for seeds, as BIP39 requires; NFC for passwords.
  unorm_dart: ^0.3.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.24.0

# The themes, for Flutter apps that depend on this package
# (`packages/formosa/themes/<name>.json`).
flutter:
  assets:
    - themes/
